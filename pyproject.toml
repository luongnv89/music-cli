[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coder-music-cli"
version = "0.10.1"
description = "A command-line music application for coders with daemon support, radio streaming, and AI-generated music"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Luong Nguyen", email = "luongnv89@gmail.com"}
]
maintainers = [
    {name = "Luong Nguyen", email = "luongnv89@gmail.com"}
]
keywords = ["music", "cli", "daemon", "radio", "ai-music", "focus", "coding", "background-music", "lofi", "productivity", "media-keys", "mpris", "now-playing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

dependencies = [
    "click>=8.0",
    "tomli-w>=1.0",
    # Media controller dependencies (platform-specific)
    "pyobjc-framework-MediaPlayer>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
ai = [
    "torch>=2.0",
    "transformers>=5,<6",
    # Floor matches the diffusers-based strategies in music_cli.sources.ai_models
    # (ModularPipeline requires 0.39.x; see the minimax extra below).
    "diffusers>=0.39.0",
    "scipy>=1.10",
    "tqdm>=4.64",
]
# MiniMax Music 3 requires Diffusers ModularPipeline (released in 0.39.x).
minimax = [
    "torch>=2.0",
    "diffusers>=0.39.0,<0.40.0",
    "transformers>=5,<6",
    "scipy>=1.10",
    "numpy>=1.24",
]
youtube = [
    # yt-dlp extractors rot quickly; older releases can no longer fetch from
    # YouTube. 2026.7.4 is the newest release verified to extract successfully.
    "yt-dlp>=2026.7.4",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    # Pinned to the exact ruff-pre-commit hook rev in .pre-commit-config.yaml
    # and the constraints-dev.txt CI pin so lint results are identical
    # everywhere (issue #55).
    "ruff==0.16.4",
    "mypy==2.3.1",
    "bandit>=1.7",
    # pip-audit establishes the advisory baseline for milestone M1 (issue #44):
    # without it the audit could not assess vulnerabilities at all, so M1's
    # exit condition ("0 High or Critical advisories") was unmeasurable.
    "pip-audit>=2.7",
    "pre-commit>=3.0",
    "numpy>=1.24",
]

[project.scripts]
music-cli = "music_cli.cli:main"
mc = "music_cli.cli:main"

[project.urls]
Homepage = "https://github.com/luongnv89/music-cli"
Repository = "https://github.com/luongnv89/music-cli"
Documentation = "https://github.com/luongnv89/music-cli#readme"
Issues = "https://github.com/luongnv89/music-cli/issues"
Changelog = "https://github.com/luongnv89/music-cli/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["music_cli*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "S", "PTH"]
ignore = [
    "E501",   # Allow long lines
    "S101",   # Allow assert statements
    "S311",   # Allow random for non-crypto (music shuffle)
    "S324",   # Allow md5 for non-crypto (file naming)
    "S603",   # Allow subprocess without shell=True validation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

[tool.mypy]
# Aligned with requires-python (>=3.12) as of Task 3.1 / #58: the installed
# numpy stubs use PEP 695 `type` statements, which mypy rejects when targeting
# <3.12 (exit 2 without checking a single file — see issue #37 / F-CI-002).
# Raising the project floor to 3.12 made 3.12 both the floor and the lowest
# target mypy can run to completion on.
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "music_cli.hf_cache"
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=music_cli --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", "venv"]
skips = [
    "B101",  # Allow assert statements
    "B311",  # Allow random for non-crypto purposes (music shuffle)
    "B404",  # Allow subprocess import (controlled usage)
    "B603",  # Allow subprocess without shell=True (controlled usage)
]

[tool.coverage.run]
source = ["music_cli"]
