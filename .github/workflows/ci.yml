# CI Pipeline for music-cli
# Runs on every push and pull request

name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is read-only: it builds, lints, and tests, but never writes to the repo.
# release.yml (contents: write) owns releases; this workflow must not need it.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt ruff mypy bandit[toml]
          pip install -c constraints-dev.txt click tomli tomli-w types-click
          # Install numpy so the same stubs a developer has are present in CI;
          # without it mypy skips the numpy stubs entirely and masks crashes
          # like issue #37, so local and CI results would diverge.
          pip install -c constraints-dev.txt "numpy>=1.24"

      - name: Check formatting with Ruff
        run: ruff format --check --diff music_cli/

      - name: Lint with Ruff
        run: ruff check music_cli/

      - name: Type check with mypy
        # Run through pyproject.toml's [tool.mypy] config — no inline flags —
        # so local (`.venv/bin/mypy music_cli`) and CI produce the same result.
        run: mypy music_cli

      - name: Security scan with Bandit
        run: bandit -c pyproject.toml -r music_cli/

  audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    # Establishes the advisory baseline for milestone M1 (issue #44). pip-audit
    # scans the installed environment for known vulnerabilities; M1's exit
    # condition ("0 High or Critical advisories") is only measurable once this
    # runs. The job fails on High/Critical advisories and uploads the
    # machine-readable JSON report as an artifact for traceability.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the pinned setuptools (fixes PYSEC-2026-3447 /
          # CVE-2026-59890) before the editable install so pip-audit scans
          # the fixed version, not the runner's pre-installed 79.0.1.
          pip install -c constraints-dev.txt setuptools==83.0.0
          pip install -c constraints-dev.txt -e ".[dev]"

      - name: Run pip-audit (fail on High/Critical)
        # `--strict` makes pip-audit return a non-zero exit code when
        # vulnerabilities are found, so CI fails the moment an advisory lands.
        # `-f json -o pip-audit-report.json` writes the machine-readable report.
        # Requirements mode audits a frozen list that excludes this project:
        # the unreleased editable local package is absent from PyPI, and
        # pip-audit 2.10.1 errors on editable distributions in environment
        # mode even with --skip-editable. This still audits every third-party
        # dependency installed by `-e ".[dev]"`.
        run: |
          pip list --format=freeze | grep -v '^coder-music-cli==' > /tmp/audit-requirements.txt
          pip-audit --strict -f json -o pip-audit-report.json -r /tmp/audit-requirements.txt

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Cover every version requires-python (>=3.12) admits — the matrix and
        # the declaration must agree (#39); floor raised to 3.12 in Task 3.1
        # (#58, F-DEP-001).
        python-version: ["3.12", "3.13", "3.14"]
        exclude:
          # 3.14 is pre-release; skip Windows until wheels are widely available
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          # Allow pre-release builds for 3.14
          allow-prereleases: true

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt -e ".[dev]"

      - name: Run unit + e2e tests
        run: pytest tests/ -v --cov=music_cli --cov-report=xml --cov-report=json:coverage.json --cov-report=term-missing

      # Coverage floor — kept in lockstep with --cov-fail-under=75 in
      # pyproject.toml (issue #72). The omit of ai_generator.py was removed so
      # the metric is honest, and the suite was raised onto the new floor with a
      # recorded run at 79%. We gate on the RAW percent (not the rounded display)
      # so the gate bites at floor+1: pytest-cov 7.x prints "FAIL" but does not
      # propagate the exit code under pytest 9, so we enforce with an explicit
      # check on coverage.json.
      - name: Enforce coverage floor (75%)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -c "
          import json, sys
          with open('coverage.json') as f:
              totals = json.load(f)['totals']
          pct = totals['percent_covered']
          floor = 75
          print(f'Coverage: {pct:.4f}% (floor={floor}%)')
          if pct < floor:
              print(f'::error::Coverage {pct:.4f}% is below the floor of {floor}%')
              sys.exit(1)
          print(f'::notice::Coverage {pct:.4f}% meets the floor of {floor}%')
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.xml
          # Deliberately false (decided in Task 4.4 / #63): an outage or
          # rate-limit on Codecov's ingest must not fail CI — the coverage
          # floor is enforced locally by the gate above this step, and a
          # silent upload gap is caught by checking the Codecov dashboard.
          fail_ci_if_error: false

  build:
    name: Build Package (Python)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # pytest-e2e uses language: system and requires the project venv.
          # Tests are run by the dedicated test matrix job — skip here.
          SKIP: pytest-e2e

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run shellcheck against repo shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          additional_files: install.sh scripts/validate-dev-setup.sh
