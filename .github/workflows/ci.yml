# CI Pipeline for music-cli
# Runs on every push and pull request

name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt ruff mypy bandit[toml]
          pip install -c constraints-dev.txt click tomli tomli-w types-click
          # Install numpy so the same stubs a developer has are present in CI;
          # without it mypy skips the numpy stubs entirely and masks crashes
          # like issue #37, so local and CI results would diverge.
          pip install -c constraints-dev.txt "numpy>=1.24"

      - name: Check formatting with Ruff
        run: ruff format --check --diff music_cli/

      - name: Lint with Ruff
        run: ruff check music_cli/

      - name: Type check with mypy
        # Run through pyproject.toml's [tool.mypy] config — no inline flags —
        # so local (`.venv/bin/mypy music_cli`) and CI produce the same result.
        run: mypy music_cli

      - name: Security scan with Bandit
        run: bandit -c pyproject.toml -r music_cli/

  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Cover every version requires-python (>=3.10) admits — the matrix and
        # the declaration must agree (#39). 3.10 and 3.11 are EOL-ish but still
        # in the declared support range; narrowing requires-python is F-DEP-001
        # (decided in P2), not this task.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # 3.14 is pre-release; skip Windows until wheels are widely available
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Allow pre-release builds for 3.14
          allow-prereleases: true

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt -e ".[dev]"

      - name: Run unit + e2e tests
        run: pytest tests/ -v --cov=music_cli --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build Package (Python)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-dev.txt build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          # pytest-e2e uses language: system and requires the project venv.
          # Tests are run by the dedicated test matrix job — skip here.
          SKIP: pytest-e2e
