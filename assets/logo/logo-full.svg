<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" fill="none">
  <!--
    music-cli full logo: Pulse Prompt mark + wordmark + tagline
    Mark zone: 0–72  |  Text zone: 84–340
  -->

  <!-- ── MARK ── -->
  <!-- Bar 1 -->
  <rect x="4"  y="36" width="7" height="28" rx="2" fill="#22C55E" opacity="0.35"/>
  <!-- Bar 2 -->
  <rect x="14" y="27" width="7" height="37" rx="2" fill="#22C55E" opacity="0.65"/>
  <!-- Bar 3 — center -->
  <rect x="24" y="16" width="7" height="48" rx="2" fill="#22C55E"/>
  <!-- Bar 4 -->
  <rect x="34" y="27" width="7" height="37" rx="2" fill="#22C55E" opacity="0.65"/>
  <!-- Bar 5 -->
  <rect x="44" y="36" width="7" height="28" rx="2" fill="#22C55E" opacity="0.35"/>
  <!-- Cursor underline -->
  <rect x="4" y="67" width="47" height="2.5" rx="1.25" fill="#22C55E" opacity="0.25"/>

  <!-- Vertical divider -->
  <line x1="66" y1="12" x2="66" y2="60" stroke="#E4E4E7" stroke-width="1"/>

  <!-- ── WORDMARK ── -->
  <text
    x="80" y="44"
    font-family="'SF Mono','JetBrains Mono','Fira Code',monospace"
    font-size="26"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#18181B"
  >music<tspan fill="#22C55E">-cli</tspan></text>

  <!-- ── TAGLINE ── -->
  <text
    x="80" y="62"
    font-family="'SF Mono','JetBrains Mono','Fira Code',monospace"
    font-size="11"
    font-weight="400"
    letter-spacing="0.5"
    fill="#71717A"
  >Code. Listen. Iterate.</text>
</svg>
