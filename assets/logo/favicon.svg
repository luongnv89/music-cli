<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    music-cli favicon — 32×32 "Pulse Prompt"
    Five bars simplified to three for legibility at small sizes.
  -->

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#09090B"/>

  <!-- Bar 1 — short -->
  <rect x="4"  y="18" width="4" height="10" rx="1.5" fill="white" opacity="0.35"/>

  <!-- Bar 2 — medium -->
  <rect x="10" y="13" width="4" height="15" rx="1.5" fill="white" opacity="0.65"/>

  <!-- Bar 3 — center, green -->
  <rect x="16" y="8"  width="4" height="20" rx="1.5" fill="#22C55E"/>

  <!-- Bar 4 — medium -->
  <rect x="22" y="13" width="4" height="15" rx="1.5" fill="white" opacity="0.65"/>

  <!-- Bar 5 — short -->
  <rect x="28" y="18" width="4" height="10" rx="1.5" fill="white" opacity="0.35"/>
</svg>
